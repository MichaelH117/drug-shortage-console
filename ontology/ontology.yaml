# Ontology for the Drug Shortage Operations Console (ML-02, AC-3.1).
# Single source of truth: object types, link types and action types.
# Maps one-to-one onto Foundry concepts (DESIGN section 11): object types with primary keys,
# link types with cardinality, action types with roles and submission-criterion ids.
# Views are generated by pipeline/objects.py (create_object_views) every run.
#   source: a pipeline-owned table the view reads from
#   edits:  an append-only ops.* edit table; the latest edit per key wins (ADR 003)
#   defaults: values used when a base row has no edit yet
version: 1

roles: [pharmacist, buyer, viewer]

objects:
  Drug:
    key: [ndc11]
    view: obj.drug
    source: core.drug
    synthetic: false
    properties:
      ndc11: varchar
      product_ndc9: varchar
      generic_name: varchar
      ingredient_norm: varchar
      dosage_form_norm: varchar
      route_norm: varchar
      strength_norm: varchar
      manufacturer: varchar
      rxcui: varchar
      source: varchar

  ShortageEvent:
    key: [event_key]
    view: obj.shortage_event
    source: core.shortage_event
    synthetic: false
    properties:
      event_key: varchar
      ndc11: varchar
      product_ndc9: varchar
      generic_name: varchar
      presentation: varchar
      first_seen: date
      last_seen: date

  Substitute:
    key: [substitute_id]
    view: obj.substitute
    source: core.substitute_candidate
    edits: ops.substitute_edit
    defaults: {state: candidate}
    synthetic: false
    properties:
      substitute_id: varchar
      event_key: varchar
      alt_ndc11: varchar
      state: varchar

  MitigationTask:
    key: [task_id]
    view: obj.mitigation_task
    edits: ops.mitigation_task_edit   # write-back only object: no pipeline base
    synthetic: true
    properties:
      task_id: varchar
      event_key: varchar
      facility_id: varchar
      assignee_id: varchar
      due_date: date
      state: varchar

  Facility:
    key: [facility_id]
    view: obj.facility
    source: seed.facility
    synthetic: true
    properties:
      facility_id: varchar
      name: varchar
      kind: varchar
      beds: integer

links:
  drug_shortage_event:
    from: Drug
    to: ShortageEvent
    cardinality: "1-*"
    view: link.drug_shortage_event
    from_key: ndc11
    to_key: event_key
    sql: >
      SELECT d.ndc11, e.event_key
      FROM obj.drug d JOIN obj.shortage_event e ON e.ndc11 = d.ndc11

  shortage_event_facility:
    from: ShortageEvent
    to: Facility
    cardinality: "*-*"
    view: link.shortage_event_facility
    from_key: event_key
    to_key: facility_id
    sql: >
      SELECT m.event_key, s.facility_id, m.item_id, m.match_tier, m.match_confidence,
             m.matched_on, s.days_on_hand
      FROM core.formulary_match m JOIN seed.facility_stock s ON s.item_id = m.item_id

  shortage_event_substitute:
    from: ShortageEvent
    to: Substitute
    cardinality: "1-*"
    view: link.shortage_event_substitute
    from_key: event_key
    to_key: substitute_id
    sql: >
      SELECT event_key, substitute_id FROM obj.substitute

  substitute_alt_drug:
    from: Substitute
    to: Drug
    cardinality: "*-1"
    view: link.substitute_alt_drug
    from_key: substitute_id
    to_key: ndc11
    sql: >
      SELECT substitute_id, alt_ndc11 AS ndc11 FROM obj.substitute

  shortage_event_task:
    from: ShortageEvent
    to: MitigationTask
    cardinality: "1-*"
    view: link.shortage_event_task
    from_key: event_key
    to_key: task_id
    sql: >
      SELECT event_key, task_id FROM obj.mitigation_task

  task_facility:
    from: MitigationTask
    to: Facility
    cardinality: "*-1"
    view: link.task_facility
    from_key: task_id
    to_key: facility_id
    sql: >
      SELECT task_id, facility_id FROM obj.mitigation_task

# Criterion ids are recorded in audit.action_log.failed_criterion when an action is refused.
# "role" is checked by the runner before these (actor active and role allowed).
actions:
  propose_substitute:
    object_type: Substitute
    roles: [pharmacist, buyer]
    criteria: [event_exists, alt_drug_exists, alt_not_same_ndc, not_already_decided, reason_given]

  approve_substitute:
    object_type: Substitute
    roles: [pharmacist]
    criteria: [substitute_exists, state_is_proposed, alt_not_short, reason_given]

  reject_substitute:
    object_type: Substitute
    roles: [pharmacist]
    criteria: [substitute_exists, state_is_proposed, reason_given]

  open_mitigation_task:
    object_type: MitigationTask
    roles: [pharmacist, buyer]
    criteria: [event_exists, facility_valid, assignee_active_staff, due_not_past, no_open_task_for_event_facility]

  close_mitigation_task:
    object_type: MitigationTask
    roles: [pharmacist, buyer]   # further limited by actor_is_assignee_or_pharmacist
    criteria: [task_exists, actor_is_assignee_or_pharmacist, task_is_open, note_min_10_chars]

  reassign_task:
    object_type: MitigationTask
    roles: [pharmacist, buyer]
    criteria: [task_exists, task_is_open, assignee_differs, assignee_active_staff, reason_given]
