# Single source of paths, thresholds and limits (owner: data-engineer). DESIGN sections 0, 3, 8.
version: "1.0"
timezone: America/New_York          # snapshot dates are local dates here (DESIGN T10)
api:
  base_url: https://api.fda.gov/drug/shortages.json
  page_size: 1000                    # openFDA max limit
  max_skip: 25000                    # openFDA max skip
  timeout_s: 30
paths:
  demo_root: data/demo
  live_root: data/live
  fixture_snapshots: tests/fixtures/snapshots
  db_file: console.duckdb
  reports: reports
duckdb:
  memory_limit: 512MB                # 2 GB PC (DESIGN T1)
  threads: 2
dq:
  volume_tolerance: 0.20             # AC-1.5 (a) +/-20% vs previous snapshot
  freshness_days: 3                  # AC-1.5 (b) meta.last_updated no older than this
stale_days: 1                        # AC-5.4 stale banner
seed: 42
schema:
  # AC-1.5 (c), checked by field NAME per snapshot. A field outside known_fields is "unexpected"; a field in
  # required_fields that no record carries is "missing". Either one FAILs schema_drift and is named in the detail.
  # known_fields = the 22 documented searchable fields. required_fields = the fields present on every record of the
  # live pull of 2026-10-30, plus availability (on every Current record). strength, proprietary_name and type are
  # documented but were absent from all 1614 live records, so they are known but not required.
  known_fields: [package_ndc, generic_name, proprietary_name, company_name, contact_info, presentation, update_type,
                 availability, related_info, related_info_link, resolved_note, shortage_reason, therapeutic_category,
                 dosage_form, strength, status, update_date, change_date, discontinued_date, initial_posting_date,
                 openfda, type]
  required_fields: [package_ndc, generic_name, company_name, contact_info, presentation, update_type, availability,
                    therapeutic_category, dosage_form, status, update_date, initial_posting_date]
