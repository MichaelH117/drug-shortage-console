# Light CI (OPS-02): lint + offline tests only.
# No secrets, no network calls to api.fda.gov (live tests are skipped unless DSC_LIVE=1),
# no LLM, no scheduled pulls (a daily pull needs the owner's approval first, E4).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSC_LIVE: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Build the offline demo DB (SYNTHETIC fixtures)
        run: python -m pipeline.run --fixtures

      - name: Tests (offline; live tests skipped)
        run: python -m pytest tests -q -m "not live"
